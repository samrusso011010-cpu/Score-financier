<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Révision — Score de santé financière</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#122A2E; --ink-soft:#3E5459; --paper:#EEF2F0; --card:#FFFFFF;
    --line: rgba(18,42,46,0.14); --line-strong: rgba(18,42,46,0.28);
    --gold:#B9862F; --gold-light:#F3E7D2; --teal:#1F6F5C; --teal-light:#E1EDE8;
    --red:#B4432E; --red-light:#F5E3DE; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5;}
  .wrap{max-width:1100px;margin:0 auto;padding:30px 20px 80px;}
  h1{font-family:'Newsreader',serif;font-weight:500;font-size:24px;margin:0 0 4px;}
  .sub{color:var(--ink-soft);font-size:13px;margin:0 0 24px;}
  .grid{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start;}
  @media (max-width:860px){.grid{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .card h2{font-size:14px;font-weight:600;margin:0 0 14px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 4px;}
  .field{margin-bottom:12px;}
  input[type=text],input[type=email],input[type=tel]{width:100%;padding:9px 11px;font-size:14px;font-family:'Inter',sans-serif;border:1px solid var(--line-strong);border-radius:7px;background:#fff;color:var(--ink);}
  textarea{width:100%;min-height:220px;font-family:ui-monospace,Consolas,monospace;font-size:12px;padding:10px;border:1px solid var(--line-strong);border-radius:7px;background:#fff;color:var(--ink);}
  input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-light);}
  button.btn{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;padding:11px 18px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;width:100%;margin-top:6px;}
  button.btn:hover{background:#0B1D20;}
  button.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line-strong);}
  button.btn.secondary:hover{background:rgba(18,42,46,0.05);}
  button.btn.approve{background:var(--teal);border-color:var(--teal);}
  button.btn.approve:hover{background:#175945;}
  button.btn:disabled{opacity:.45;cursor:not-allowed;}
  details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:10px;}
  .status{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:8px;display:none;}
  .status.show{display:block;}
  .status.ok{background:var(--teal-light);color:var(--teal);}
  .status.err{background:var(--red-light);color:var(--red);}
  .status.info{background:var(--gold-light);color:var(--gold);}
  .preview-frame{width:100%;height:900px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--gold-light);color:var(--gold);margin-left:8px;}
  .top-score{display:flex;gap:16px;align-items:baseline;margin-bottom:10px;}
  .top-score .n{font-family:'Newsreader',serif;font-size:38px;font-weight:500;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Révision avant envoi <span class="badge" id="mode-badge"></span></h1>
  <p class="sub">Outil interne — vérifie et ajuste les réponses au besoin, prévisualise le PDF, puis approuve l'envoi au client.</p>

  <div class="grid">
    <div>
      <div class="card">
        <h2>Coordonnées du client</h2>
        <div class="field"><label>Nom</label><input type="text" id="f-name"></div>
        <div class="field"><label>Courriel</label><input type="email" id="f-email"></div>
        <div class="field"><label>Téléphone</label><input type="tel" id="f-phone"></div>
      </div>

      <div class="card">
        <h2>Accès</h2>
        <div class="field">
          <label>Clé d'accès admin</label>
          <input type="text" id="f-token" placeholder="Requise pour envoyer un courriel">
        </div>
      </div>

      <div class="card">
        <div class="top-score">
          <span class="n" id="v-score">—</span>
          <span id="v-tier" style="font-weight:600;"></span>
        </div>
        <p class="sub" id="v-segment" style="margin:0;"></p>
      </div>

      <div class="card">
        <details>
          <summary>Réponses complètes (JSON — édition avancée)</summary>
          <textarea id="f-json" spellcheck="false"></textarea>
          <button class="btn secondary" id="btn-apply">Appliquer les modifications JSON</button>
        </details>
      </div>

      <div class="card">
        <button class="btn secondary" id="btn-regen">Régénérer l'aperçu PDF</button>
        <button class="btn approve" id="btn-send" disabled>Approuver et envoyer au client</button>
        <div class="status" id="status"></div>
      </div>
    </div>

    <div class="card" style="padding:10px;">
      <iframe class="preview-frame" id="preview" title="Aperçu PDF"></iframe>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="pdf-engine.js"></script>
<script>
// ======================= JEU DE RÉPONSES DE TEST =======================
const SAMPLE_ANSWERS = {
  age: 38,
  s1:2, s2:2, s3:2, s4:2, s5:2, s6:3, s7:2, s8:1, s9:2, s10:1,
  goals:['retraite','propriete'], horizons:{retraite:'27', propriete:'3'},
  revenu:2, epargne:2, survie:2, entreprise:'oui', immo_secondaire:'non',
  residence:'oui', residence_valeur:'420000', hypotheque:'oui',
  enfants:'oui', enfants_nombre:2, enfants_ages:['6','9'],
  reei_admissible:'non', succession:'oui', succession_precision:['enfants','impot'],
  vie_raisons:['dettes','niveau_vie','continuite'], invalidite_raisons:['revenu','cotisations'],
  maladie_raisons:['proteger_plan','enfants'],
  biz_employe_cle:'oui', biz_assurance_corpo:'non', biz_dividendes:'oui', biz_convention:'non', biz_releve:'non',
  accounts_selected:['REER','CELI','NONENR'],
  accounts_details:{
    REER:{solde:'62000', cotisation:'400', freq:'mensuelle'},
    CELI:{solde:'31000', cotisation:'200', freq:'mensuelle'},
    NONENR:{solde:'8000'}
  },
  profil:1, allocation_actuelle:0,
  lead_name:'Marie Tremblay', lead_email:'marie.tremblay@example.com', lead_phone:'514 555-0123'
};

// ======================= DÉCODAGE URL =======================
function decodeAnswers(d){
  const b64 = d.replace(/-/g,'+').replace(/_/g,'/');
  const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
  const binary = atob(padded);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}

const params = new URLSearchParams(location.search);
let answers;
let isTestMode = !params.get('d');
if(isTestMode){
  answers = JSON.parse(JSON.stringify(SAMPLE_ANSWERS));
} else {
  try { answers = decodeAnswers(params.get('d')); }
  catch(e){ alert("Lien invalide ou corrompu."); answers = JSON.parse(JSON.stringify(SAMPLE_ANSWERS)); isTestMode = true; }
}
document.getElementById('mode-badge').textContent = isTestMode ? 'Mode test (données d\'exemple)' : 'Réponses reçues';

let currentPdfDoc = null, currentPdfUrl = null;

function syncFieldsFromAnswers(){
  document.getElementById('f-name').value = answers.lead_name || '';
  document.getElementById('f-email').value = answers.lead_email || '';
  document.getElementById('f-phone').value = answers.lead_phone || '';
  document.getElementById('f-json').value = JSON.stringify(answers, null, 2);
}

document.getElementById('f-token').value = localStorage.getItem('adminToken') || '';
document.getElementById('f-token').addEventListener('input', e => localStorage.setItem('adminToken', e.target.value));
function syncAnswersFromNameFields(){
  answers.lead_name = document.getElementById('f-name').value;
  answers.lead_email = document.getElementById('f-email').value;
  answers.lead_phone = document.getElementById('f-phone').value;
}
function updateScorePanel(){
  const total = PDFEngine.scoreTotal(answers);
  const tier = PDFEngine.scoreTier(total);
  const segment = PDFEngine.computeSegment(answers);
  document.getElementById('v-score').textContent = total;
  const tierEl = document.getElementById('v-tier');
  tierEl.textContent = tier.tier;
  tierEl.style.color = `rgb(${tier.color.join(',')})`;
  document.getElementById('v-segment').textContent = 'Segment : ' + PDFEngine.SEGMENT_LABELS[segment];
}
function setStatus(msg, kind){
  const el = document.getElementById('status');
  el.textContent = msg; el.className = 'status show ' + (kind||'info');
}
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v||''); }

async function regenerate(){
  document.getElementById('btn-regen').disabled = true;
  document.getElementById('btn-regen').textContent = 'Génération en cours…';
  try{
    updateScorePanel();
    const doc = await PDFEngine.genererPDF(answers);
    currentPdfDoc = doc;
    if(currentPdfUrl) URL.revokeObjectURL(currentPdfUrl);
    const blob = doc.output('blob');
    currentPdfUrl = URL.createObjectURL(blob);
    document.getElementById('preview').src = currentPdfUrl;
    document.getElementById('btn-send').disabled = !validEmail(answers.lead_email);
  } catch(e){
    console.error(e);
    setStatus('Erreur de génération du PDF : ' + e.message, 'err');
  } finally {
    document.getElementById('btn-regen').disabled = false;
    document.getElementById('btn-regen').textContent = "Régénérer l'aperçu PDF";
  }
}

document.getElementById('f-name').addEventListener('input', ()=>{ syncAnswersFromNameFields(); document.getElementById('f-json').value = JSON.stringify(answers, null, 2); });
document.getElementById('f-email').addEventListener('input', ()=>{ syncAnswersFromNameFields(); document.getElementById('f-json').value = JSON.stringify(answers, null, 2); document.getElementById('btn-send').disabled = !validEmail(answers.lead_email); });
document.getElementById('f-phone').addEventListener('input', ()=>{ syncAnswersFromNameFields(); document.getElementById('f-json').value = JSON.stringify(answers, null, 2); });

document.getElementById('btn-apply').addEventListener('click', ()=>{
  try{
    answers = JSON.parse(document.getElementById('f-json').value);
    syncFieldsFromAnswers();
    updateScorePanel();
    setStatus('Modifications appliquées. Régénère l\'aperçu pour les voir dans le PDF.', 'info');
  } catch(e){ setStatus('JSON invalide : ' + e.message, 'err'); }
});
document.getElementById('btn-regen').addEventListener('click', regenerate);

document.getElementById('btn-send').addEventListener('click', async ()=>{
  if(!currentPdfDoc){ setStatus('Régénère l\'aperçu avant d\'envoyer.', 'err'); return; }
  if(!validEmail(answers.lead_email)){ setStatus('Courriel du client invalide.', 'err'); return; }
  const token = document.getElementById('f-token').value.trim();
  if(!token){ setStatus("Entre la clé d'accès admin avant d'envoyer.", 'err'); return; }
  const btn = document.getElementById('btn-send');
  btn.disabled = true; btn.textContent = 'Envoi en cours…';
  try{
    const pdfBase64 = currentPdfDoc.output('datauristring').split(',')[1];
    const res = await fetch('/api/send', {
      method:'POST', headers:{'Content-Type':'application/json', 'x-admin-token': token},
      body: JSON.stringify({
        to: answers.lead_email,
        name: answers.lead_name || '',
        pdfBase64,
        filename: `score-sante-financiere-${(answers.lead_name||'client').replace(/\s+/g,'-').toLowerCase()}.pdf`
      })
    });
    if(!res.ok) throw new Error(await res.text());
    setStatus('Courriel envoyé avec succès à ' + answers.lead_email + '.', 'ok');
    btn.textContent = 'Envoyé ✓';
  } catch(e){
    console.error(e);
    setStatus("Échec de l'envoi : " + e.message, 'err');
    btn.disabled = false; btn.textContent = 'Approuver et envoyer au client';
  }
});

syncFieldsFromAnswers();
updateScorePanel();
regenerate();
</script>
</body>
</html>
